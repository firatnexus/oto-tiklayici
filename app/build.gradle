plugins {
    id 'com.android.application'
}

android {
    namespace 'com.firatnexus.ototiklayici'
    compileSdk 35

    defaultConfig {
        applicationId 'com.firatnexus.ototiklayici'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Anahtar yoksa debug anahtarıyla imzala ki APK yine de kurulabilsin
            signingConfig System.getenv('KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}
